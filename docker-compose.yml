# =========================================================
# 공통 Airflow 설정 (YAML anchor)
#
# Airflow 3.x부터 컴포넌트가 init/apiserver/scheduler/
# dag-processor/worker로 늘어났고, 전부 동일한 JWT secret /
# execution API 주소를 공유해야 하므로 anchor로 관리한다.
# =========================================================
x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  AIRFLOW__CORE__EXECUTOR: CeleryExecutor

  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0

  AIRFLOW__CELERY__RESULT_BACKEND: >-
    db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  # EC2(vCPU 2개)에서 mapped download_file 태스크가 다수 동시에 뜨면
  # 각 태스크 프로세스가 tlc_pipeline.py(scipy 등 무거운 import 포함)를
  # 재import하며 CPU를 다같이 나눠쓰다 기본 30초를 넘겨 DagBag import
  # timeout이 나던 문제 → 넉넉하게 늘림
  AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"

  # Airflow 3.x: Scheduler/Worker/DAG Processor가 Task 실행 정보를 가져오는 API 서버 주소
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

  # Airflow 3.x: 컴포넌트 간 인증용 공유 시크릿 (모든 컴포넌트 동일 값 필요)
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}

  AIRFLOW_UID: ${AIRFLOW_UID}

  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

  # local/aws 모드 스위치(src/common/config.py 참고). 여기서 명시적으로
  # 안 넘기면 컨테이너 안에서는 항상 기본값(aws)으로 떨어져서 .env에
  # APP_ENV=local을 설정해도 무시된다(실제로 겪음 — AWS_REGION이 빈
  # 문자열이라 dynamodb 엔드포인트가 "https://dynamodb..amazonaws.com"
  # 같은 잘못된 값으로 만들어져서 실패했다).
  APP_ENV: ${APP_ENV:-aws}

  # S3(Bronze/Silver/Gold)/RDS(Gold 서빙 테이블) 접속 정보. S3는 정적 키
  # 없이 EC2 인스턴스에 붙은 IAM 롤로 인증한다.
  AWS_REGION: ${AWS_REGION}
  S3_BUCKET_DATA: ${S3_BUCKET_DATA}
  DYNAMODB_NAV_TABLE: ${DYNAMODB_NAV_TABLE}
  TLC_TYPE3_ROLLING_WEEKS: ${TLC_TYPE3_ROLLING_WEEKS:-12}

  # src/common/dynamo.py(nav 골드 서빙 공용 클라이언트)의 기본값
  # "http://localhost:8002"는 호스트(venv)에서 직접 돌릴 때만 맞다 —
  # 컨테이너 안에서는 localhost가 컨테이너 자기 자신을 가리켜서
  # dynamodb-local에 연결이 안 된다(EndpointConnectionError로 실제로 겪음).
  # 컨테이너 안에서는 docker-compose 서비스명 + 내부 포트(8000, 호스트에
  # 매핑된 8002가 아님)로 접속해야 한다.
  DYNAMO_LOCAL_ENDPOINT: http://dynamodb-local:8000

  # EMR Serverless(Spark 잡 실행)/DynamoDB(세그먼트 메트릭 서빙 테이블) 접속 정보.
  # nav-api 서비스와 동일한 DYNAMODB_TABLE_TYPE1/2 기본값 패턴을 공유한다.
  EMR_APPLICATION_ID: ${EMR_APPLICATION_ID:-}
  EMR_JOB_ROLE_ARN: ${EMR_JOB_ROLE_ARN:-}
  DYNAMODB_TABLE_TYPE1: ${DYNAMODB_TABLE_TYPE1:-SegmentMetricsType1}
  DYNAMODB_TABLE_TYPE2: ${DYNAMODB_TABLE_TYPE2:-SegmentMetricsType2}
  NAV_GOLD_TABLE: ${NAV_GOLD_TABLE:-nav_gold_values}

  PYTHONPATH: /opt/airflow

# CI(GitHub Actions)가 ECR에 미리 빌드해둔 이미지를 가리키는 값.
# 비워두면 기존처럼 로컬 Dockerfile을 직접 빌드한다 — EC2(2 vCPU)에서
# pip install 등 빌드 자체가 CPU를 잡아먹는 걸 피하려면 CI에서 빌드/push하고
# 여기선 AIRFLOW_IMAGE를 ECR 경로로 채운 뒤 `docker compose pull`만 하면 된다.
x-airflow-image: &airflow-image
  image: ${AIRFLOW_IMAGE:-three-idiots-airflow:local}

x-airflow-volumes: &airflow-volumes
  - ./dags:/opt/airflow/dags
  - ./src:/opt/airflow/src
  - ./spark_jobs:/opt/airflow/spark_jobs
  - ./scripts:/opt/airflow/scripts
  - ./data:/opt/airflow/data
  - ./logs:/opt/airflow/logs
  - ./plugins:/opt/airflow/plugins
  - ./config:/opt/airflow/config


services:

  # =========================================================
  # PostgreSQL
  # Airflow 메타데이터 DB
  # =========================================================
  postgres:
    image: postgres:16
    container_name: navigation-postgres

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - airflow-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # Redis
  # Celery Broker
  # =========================================================
  redis:
    image: redis:7
    container_name: navigation-redis

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    networks:
      - airflow-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # Airflow 초기화
  # DB Migration + 관리자 계정 생성
  # =========================================================
  airflow-init:
    <<: *airflow-image
    build:
      context: .
      dockerfile: Dockerfile

    container_name: navigation-airflow-init

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME}
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname Admin
      --lastname User
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL}
      || true &&
      airflow pools set downloads 16 'TLC 파일 다운로드 동시 실행 제한 (네트워크 대역폭 보호용)' &&
      airflow pools set silver_pool 3 'TLC Silver 변환(Spark) 동시 실행 제한 (spark-master 1대 자원 보호용)' &&
      python /opt/airflow/scripts/create_dynamodb_tables.py &&
      python /opt/airflow/scripts/seed_dynamodb_defaults.py
      "


  # =========================================================
  # Airflow API Server
  # Airflow 3.x부터 Webserver가 API Server로 대체됨 (UI도 여기서 서빙)
  # =========================================================
  airflow-apiserver:
    <<: *airflow-image
    build:
      context: .
      dockerfile: Dockerfile

    container_name: navigation-airflow-apiserver

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    ports:
      - "8080:8080"

    networks:
      - airflow-network

    command: api-server


  # =========================================================
  # Airflow Scheduler
  # =========================================================
  airflow-scheduler:
    <<: *airflow-image
    build:
      context: .
      dockerfile: Dockerfile

    container_name: navigation-airflow-scheduler

    # 컨테이너가 예상 못 한 이유로 죽으면(OOM 등) Docker가 자동으로 다시
    # 띄운다 — 이게 없으면 스케줄러/워커가 죽어도 아무도 모르고 파이프라인이
    # 통째로 멈춘 채 방치된다(이 죽음 자체는 Slack 알림 대상이 아님 — 알림이
    # Airflow 태스크 실행 경로 안에서 도는 코드라 스케줄러/워커가 죽으면 그
    # 경로 자체가 멈춘다).
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network

    command: scheduler


  # =========================================================
  # Airflow DAG Processor
  # Airflow 3.x부터 DAG 파싱이 Scheduler에서 분리되어
  # 별도 컴포넌트로 필수 실행되어야 함
  # =========================================================
  airflow-dag-processor:
    <<: *airflow-image
    build:
      context: .
      dockerfile: Dockerfile

    container_name: navigation-airflow-dag-processor

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network

    command: dag-processor


  # =========================================================
  # Airflow Worker
  # 현재는 1개
  # =========================================================
  airflow-worker:
    <<: *airflow-image
    build:
      context: .
      dockerfile: Dockerfile

    container_name: navigation-airflow-worker

    # 컨테이너가 예상 못 한 이유로 죽으면(OOM 등) Docker가 자동으로 다시
    # 띄운다 — 이게 없으면 스케줄러/워커가 죽어도 아무도 모르고 파이프라인이
    # 통째로 멈춘 채 방치된다(이 죽음 자체는 Slack 알림 대상이 아님 — 알림이
    # Airflow 태스크 실행 경로 안에서 도는 코드라 스케줄러/워커가 죽으면 그
    # 경로 자체가 멈춘다).
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network
      - spark-network

    command: celery worker


  # =========================================================
  # Spark Master
  # =========================================================
  spark-master:
    image: apache/spark:4.0.4

    container_name: navigation-spark-master

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    environment:
      SPARK_NO_DAEMONIZE: "true"

    command: >
      /opt/spark/sbin/start-master.sh

    ports:
      - "7077:7077"
      - "8081:8080"

    volumes:
      - ./src:/opt/spark/src
      # Airflow 컨테이너와 동일한 절대 경로로 마운트.
      # Spark executor가 파일을 읽을 때 driver(airflow-worker)가 넘긴
      # 절대 경로(/opt/airflow/data/...)를 그대로 열어야 하기 때문에
      # 경로가 양쪽에서 반드시 같아야 함.
      - ./data:/opt/airflow/data

    networks:
      - spark-network


  # =========================================================
  # Spark Worker
  #
  # 필요에 따라 Worker 개수를 늘릴 수 있도록 구성
  # =========================================================

  spark-worker:
    image: apache/spark:4.0.4

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    depends_on:
      - spark-master

    environment:
      SPARK_NO_DAEMONIZE: "true"

    command: >
      /opt/spark/sbin/start-worker.sh
      spark://spark-master:7077

    volumes:
      - ./src:/opt/spark/src
      # Airflow 컨테이너와 동일한 절대 경로로 마운트.
      # Spark executor가 파일을 읽을 때 driver(airflow-worker)가 넘긴
      # 절대 경로(/opt/airflow/data/...)를 그대로 열어야 하기 때문에
      # 경로가 양쪽에서 반드시 같아야 함.
      - ./data:/opt/airflow/data

    networks:
      - spark-network


  # =========================================================
  # DynamoDB Local
  # nav 골드 데이터셋(segment_id x type 조회) 서빙용. APP_ENV=local이면
  # 여기 붙고, aws면 실 DynamoDB에 붙는다(src/common/dynamo.py 참고).
  # -inMemory: 로컬 개발/테스트 DB라 재시작 시 초기화돼도 상관없음
  # (rds-local의 postgres_data 볼륨과 다르게 영속화 안 함).
  # =========================================================
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    container_name: traffic-dynamodb-local
    restart: unless-stopped

    command: >
      -jar DynamoDBLocal.jar -inMemory -sharedDb

    ports:
      - "8002:8000"

    networks:
      - airflow-network


  # =========================================================
  # 컨테이너 크래시 감시
  #
  # restart 정책은 "죽으면 다시 살리기"만 할 뿐, 죽었다는 사실 자체는
  # 아무도 모른다 — 특히 airflow-scheduler/airflow-worker가 죽으면
  # on_failure_callback(Slack 실패 알림)도 그 프로세스 안에서 도는
  # 코드라 같이 멈춘다("파이프라인이 통째로 죽었는데 알림도 안 오는"
  # 시나리오). Docker 이벤트 스트림을 구독하다가 die 이벤트를 잡아서
  # 대신 Slack으로 알려준다(scripts/docker_crash_monitor.sh 참고).
  #
  # docker.sock을 마운트해야 해서(호스트 Docker 데몬에 대한 사실상
  # 전체 권한) 신뢰할 수 있는 이미지/스크립트만 올린다 — 표준 라이브러리만
  # 쓰는 순수 Python 스크립트 하나뿐이라 python:3.11-alpine 그대로 쓴다.
  # =========================================================
  crash-monitor:
    image: docker:27-cli
    container_name: navigation-crash-monitor
    restart: unless-stopped

    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      WATCH_CONTAINERS: navigation-postgres,navigation-redis,navigation-airflow-apiserver,navigation-airflow-scheduler,navigation-airflow-dag-processor,navigation-airflow-worker,navigation-spark-master,traffic-dynamodb-local
      POLL_INTERVAL_SECONDS: 30

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts:/scripts:ro

    entrypoint: []
    command: sh /scripts/docker_crash_monitor.sh

    networks:
      - airflow-network


# =========================================================
# Volumes
# =========================================================
volumes:
  postgres_data:


# =========================================================
# Networks
# =========================================================
networks:

  airflow-network:
    driver: bridge

  spark-network:
    driver: bridge
