# =========================================================
# 공통 Airflow 설정 (YAML anchor)
#
# Airflow 3.x부터 컴포넌트가 init/apiserver/scheduler/
# dag-processor/worker로 늘어났고, 전부 동일한 JWT secret /
# execution API 주소를 공유해야 하므로 anchor로 관리한다.
# =========================================================
x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  AIRFLOW__CORE__EXECUTOR: CeleryExecutor

  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0

  AIRFLOW__CELERY__RESULT_BACKEND: >-
    db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  # Airflow 3.x: Scheduler/Worker/DAG Processor가 Task 실행 정보를 가져오는 API 서버 주소
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

  # Airflow 3.x: 컴포넌트 간 인증용 공유 시크릿 (모든 컴포넌트 동일 값 필요)
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}

  AIRFLOW_UID: ${AIRFLOW_UID}

  TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY}

  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

  PYTHONPATH: /opt/airflow

x-airflow-volumes: &airflow-volumes
  - ./dags:/opt/airflow/dags
  - ./src:/opt/airflow/src
  - ./data:/opt/airflow/data
  - ./logs:/opt/airflow/logs
  - ./plugins:/opt/airflow/plugins
  - ./config:/opt/airflow/config


services:

  # =========================================================
  # PostgreSQL
  # Airflow 메타데이터 DB
  # =========================================================
  postgres:
    image: postgres:16
    container_name: traffic-postgres

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - airflow-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # Redis
  # Celery Broker
  # =========================================================
  redis:
    image: redis:7
    container_name: traffic-redis

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    networks:
      - airflow-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # Airflow 초기화
  # DB Migration + 관리자 계정 생성
  # =========================================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-airflow-init

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME}
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname Admin
      --lastname User
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL}
      || true &&
      airflow pools set downloads 16 'TLC 파일 다운로드 동시 실행 제한 (네트워크 대역폭 보호용)' &&
      airflow pools set silver_pool 3 'TLC Silver 변환(Spark) 동시 실행 제한 (spark-master 1대 자원 보호용)'
      "


  # =========================================================
  # Airflow API Server
  # Airflow 3.x부터 Webserver가 API Server로 대체됨 (UI도 여기서 서빙)
  # =========================================================
  airflow-apiserver:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-airflow-apiserver

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    ports:
      - "8080:8080"

    networks:
      - airflow-network

    command: api-server


  # =========================================================
  # Airflow Scheduler
  # =========================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-airflow-scheduler

    # 컨테이너가 예상 못 한 이유로 죽으면(OOM 등) Docker가 자동으로 다시
    # 띄운다 — 이게 없으면 스케줄러/워커가 죽어도 아무도 모르고 파이프라인이
    # 통째로 멈춘 채 방치된다(이 죽음 자체는 Slack 알림 대상이 아님 — 알림이
    # Airflow 태스크 실행 경로 안에서 도는 코드라 스케줄러/워커가 죽으면 그
    # 경로 자체가 멈춘다).
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network

    command: scheduler


  # =========================================================
  # Airflow DAG Processor
  # Airflow 3.x부터 DAG 파싱이 Scheduler에서 분리되어
  # 별도 컴포넌트로 필수 실행되어야 함
  # =========================================================
  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-airflow-dag-processor

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network

    command: dag-processor


  # =========================================================
  # Airflow Worker
  # 현재는 1개
  # =========================================================
  airflow-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-airflow-worker

    # 컨테이너가 예상 못 한 이유로 죽으면(OOM 등) Docker가 자동으로 다시
    # 띄운다 — 이게 없으면 스케줄러/워커가 죽어도 아무도 모르고 파이프라인이
    # 통째로 멈춘 채 방치된다(이 죽음 자체는 Slack 알림 대상이 아님 — 알림이
    # Airflow 태스크 실행 경로 안에서 도는 코드라 스케줄러/워커가 죽으면 그
    # 경로 자체가 멈춘다).
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network
      - spark-network

    command: celery worker


  # =========================================================
  # Traffic Score API + Dashboard
  #
  # Airflow 컴포넌트가 아니라 별도 서비스다 (postgres/redis/celery 불필요).
  # src/scoring/traffic_score.py의 get_traffic_score()/get_map_data()를
  # FastAPI로 감싸서 대시보드(dashboard/index.html)에 서빙한다.
  # =========================================================
  traffic-score-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-score-api

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    environment:
      PYTHONPATH: /opt/airflow

    volumes:
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config
      - ./dashboard:/opt/airflow/dashboard

    working_dir: /opt/airflow

    ports:
      - "8000:8000"

    # apache/airflow 베이스 이미지의 기본 entrypoint(/entrypoint)가 명령을
    # airflow CLI 인자로 해석해버려서, 이 서비스는 그걸 우회해야 uvicorn이 뜬다.
    entrypoint: []
    command: >
      uvicorn src.scoring.api:app --host 0.0.0.0 --port 8000

    networks:
      - airflow-network


  # =========================================================
  # Spark Master
  # =========================================================
  spark-master:
    image: apache/spark:4.0.4

    container_name: traffic-spark-master

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    environment:
      SPARK_NO_DAEMONIZE: "true"

    command: >
      /opt/spark/sbin/start-master.sh

    ports:
      - "7077:7077"
      - "8081:8080"

    volumes:
      - ./src:/opt/spark/src
      # Airflow 컨테이너와 동일한 절대 경로로 마운트.
      # Spark executor가 파일을 읽을 때 driver(airflow-worker)가 넘긴
      # 절대 경로(/opt/airflow/data/...)를 그대로 열어야 하기 때문에
      # 경로가 양쪽에서 반드시 같아야 함.
      - ./data:/opt/airflow/data

    networks:
      - spark-network


  # =========================================================
  # Spark Worker
  #
  # 필요에 따라 Worker 개수를 늘릴 수 있도록 구성
  # =========================================================

  spark-worker:
    image: apache/spark:4.0.4

    # 예상 못 한 이유로(OOM 등) 죽으면 Docker가 자동으로 다시 띄운다
    # (자세한 설명은 airflow-scheduler 서비스의 주석 참고).
    restart: unless-stopped

    depends_on:
      - spark-master

    environment:
      SPARK_NO_DAEMONIZE: "true"

    command: >
      /opt/spark/sbin/start-worker.sh
      spark://spark-master:7077

    volumes:
      - ./src:/opt/spark/src
      # Airflow 컨테이너와 동일한 절대 경로로 마운트.
      # Spark executor가 파일을 읽을 때 driver(airflow-worker)가 넘긴
      # 절대 경로(/opt/airflow/data/...)를 그대로 열어야 하기 때문에
      # 경로가 양쪽에서 반드시 같아야 함.
      - ./data:/opt/airflow/data

    networks:
      - spark-network


  # =========================================================
  # 컨테이너 크래시 감시
  #
  # restart 정책은 "죽으면 다시 살리기"만 할 뿐, 죽었다는 사실 자체는
  # 아무도 모른다 — 특히 airflow-scheduler/airflow-worker가 죽으면
  # on_failure_callback(Slack 실패 알림)도 그 프로세스 안에서 도는
  # 코드라 같이 멈춘다("파이프라인이 통째로 죽었는데 알림도 안 오는"
  # 시나리오). Docker 이벤트 스트림을 구독하다가 die 이벤트를 잡아서
  # 대신 Slack으로 알려준다(scripts/docker_crash_monitor.py 참고).
  #
  # docker.sock을 마운트해야 해서(호스트 Docker 데몬에 대한 사실상
  # 전체 권한) 신뢰할 수 있는 이미지/스크립트만 올린다 — 표준 라이브러리만
  # 쓰는 순수 Python 스크립트 하나뿐이라 python:3.11-alpine 그대로 쓴다.
  # =========================================================
  crash-monitor:
    image: docker:27-cli
    container_name: traffic-crash-monitor
    restart: unless-stopped

    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      WATCH_CONTAINERS: traffic-postgres,traffic-redis,traffic-airflow-apiserver,traffic-airflow-scheduler,traffic-airflow-dag-processor,traffic-airflow-worker,traffic-score-api,traffic-spark-master
      POLL_INTERVAL_SECONDS: 30

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts:/scripts:ro

    entrypoint: []
    command: sh /scripts/docker_crash_monitor.sh

    networks:
      - airflow-network


# =========================================================
# Volumes
# =========================================================
volumes:
  postgres_data:


# =========================================================
# Networks
# =========================================================
networks:

  airflow-network:
    driver: bridge

  spark-network:
    driver: bridge
