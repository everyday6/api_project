# =========================================================
# 공통 Airflow 설정 (YAML anchor)
#
# Airflow 3.x부터 컴포넌트가 init/apiserver/scheduler/
# dag-processor/worker로 늘어났고, 전부 동일한 JWT secret /
# execution API 주소를 공유해야 하므로 anchor로 관리한다.
# =========================================================
x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  AIRFLOW__CORE__EXECUTOR: CeleryExecutor

  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0

  AIRFLOW__CELERY__RESULT_BACKEND: >-
    db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  # Airflow 3.x: Scheduler/Worker/DAG Processor가 Task 실행 정보를 가져오는 API 서버 주소
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

  # Airflow 3.x: 컴포넌트 간 인증용 공유 시크릿 (모든 컴포넌트 동일 값 필요)
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}

  AIRFLOW_UID: ${AIRFLOW_UID}

  TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY}

  PYTHONPATH: /opt/airflow

x-airflow-volumes: &airflow-volumes
  - ./dags:/opt/airflow/dags
  - ./src:/opt/airflow/src
  - ./data:/opt/airflow/data
  - ./logs:/opt/airflow/logs
  - ./plugins:/opt/airflow/plugins


services:

  # =========================================================
  # PostgreSQL
  # Airflow 메타데이터 DB
  # =========================================================
  postgres:
    image: postgres:16
    container_name: traffic-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - airflow-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # Redis
  # Celery Broker
  # =========================================================
  redis:
    image: redis:7
    container_name: traffic-redis

    networks:
      - airflow-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # Airflow 초기화
  # DB Migration + 관리자 계정 생성
  # =========================================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-airflow-init

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME}
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname Admin
      --lastname User
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL}
      || true
      "


  # =========================================================
  # Airflow API Server
  # Airflow 3.x부터 Webserver가 API Server로 대체됨 (UI도 여기서 서빙)
  # =========================================================
  airflow-apiserver:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-airflow-apiserver

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    ports:
      - "8080:8080"

    networks:
      - airflow-network

    command: api-server


  # =========================================================
  # Airflow Scheduler
  # =========================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-airflow-scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network

    command: scheduler


  # =========================================================
  # Airflow DAG Processor
  # Airflow 3.x부터 DAG 파싱이 Scheduler에서 분리되어
  # 별도 컴포넌트로 필수 실행되어야 함
  # =========================================================
  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-airflow-dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network

    command: dag-processor


  # =========================================================
  # Airflow Worker
  # 현재는 1개
  # =========================================================
  airflow-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: traffic-airflow-worker

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

    environment: *airflow-env

    volumes: *airflow-volumes

    networks:
      - airflow-network
      - spark-network

    command: celery worker


  # =========================================================
  # Spark Master
  # =========================================================
  spark-master:
    image: apache/spark:4.0.4

    container_name: traffic-spark-master

    environment:
      SPARK_NO_DAEMONIZE: "true"

    command: >
      /opt/spark/sbin/start-master.sh

    ports:
      - "7077:7077"
      - "8081:8080"

    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data

    networks:
      - spark-network


  # =========================================================
  # Spark Worker
  #
  # 필요에 따라 Worker 개수를 늘릴 수 있도록 구성
  # =========================================================

  spark-worker:
    image: apache/spark:4.0.4

    depends_on:
      - spark-master

    environment:
      SPARK_NO_DAEMONIZE: "true"

    command: >
      /opt/spark/sbin/start-worker.sh
      spark://spark-master:7077

    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data

    networks:
      - spark-network


# =========================================================
# Volumes
# =========================================================
volumes:
  postgres_data:


# =========================================================
# Networks
# =========================================================
networks:

  airflow-network:
    driver: bridge

  spark-network:
    driver: bridge
