<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic Score Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1220;
    --panel: #121b2e;
    --panel-2: #16213a;
    --ink: #eaeef6;
    --ink-muted: #8b96ac;
    --rule: #263454;
    --accent: #f2a341;
    --r0: #7a3b3b; --r1: #9c4040; --r2: #c04a3a; --r3: #e0522f; --r4: #ff7a4d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 1fr 340px; height: 100vh; overflow: hidden;
  }
  .map-pane { position: relative; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }

  .side {
    background: var(--panel); border-left: 1px solid var(--rule);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .side-section { padding: 16px; border-bottom: 1px solid var(--rule); }
  .side h1 { font-size: 14px; font-weight: 700; margin: 0 0 12px; }

  .time-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .time-row label { font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
  .time-row label b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .time-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .time-row button {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }

  .search-row { display: flex; gap: 6px; }
  .search-row input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink);
    border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 13px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .search-row button {
    background: var(--accent); color: #1a1206; border: none; border-radius: 6px;
    padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .hint { font-size: 11px; color: var(--ink-muted); margin-top: 6px; }

  .detail .empty { color: var(--ink-muted); font-size: 13px; }
  .detail .seg-id {
    font-family: ui-monospace, "SF Mono", monospace; font-size: 13px; color: var(--ink-muted);
  }
  .detail .score {
    font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 6px 0 2px;
  }
  .detail .score-label { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .06em; }
  .detail .ts-hour {
    display: inline-block; margin-top: 8px; font-size: 11px; padding: 3px 8px;
    border-radius: 999px; background: var(--panel-2); color: var(--ink-muted);
    border: 1px solid var(--rule);
  }

  .comp-group { margin-top: 16px; }
  .comp-group .cap { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); margin-bottom: 6px; font-weight: 600; }
  .comp-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
  .comp-row:last-child { border-bottom: none; }
  .comp-row .v { font-family: ui-monospace, "SF Mono", monospace; font-variant-numeric: tabular-nums; color: var(--ink-muted); }
  .comp-total { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; padding-top: 8px; margin-top: 4px; border-top: 1px solid var(--rule); }
  .comp-total .v { font-family: ui-monospace, "SF Mono", monospace; }

  .legend { padding: 16px; }
  .legend .cap { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); margin-bottom: 8px; font-weight: 600; }
  .legend .row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3px 0; }
  .legend .swatch { width: 20px; height: 4px; border-radius: 2px; flex: none; }

  .zoomhint {
    position: absolute; top: 12px; right: 12px; font-size: 10.5px; color: var(--ink-muted);
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px;
  }
  .status {
    position: absolute; top: 12px; left: 12px; font-size: 12px; color: var(--ink-muted);
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px;
  }
</style>
</head>
<body>
  <div class="map-pane">
    <canvas id="map"></canvas>
    <div class="status" id="status">불러오는 중...</div>
    <div class="zoomhint">드래그로 이동 · 스크롤로 확대/축소 · 클릭으로 세그먼트 선택</div>
  </div>

  <div class="side">
    <div class="side-section">
      <h1>Traffic Score Dashboard</h1>
      <div class="time-row">
        <label>조회 시각 <b id="hour-label">--</b>시</label>
        <input type="range" id="hour-slider" min="0" max="23" step="1">
        <button id="now-btn">지금</button>
      </div>
      <div class="search-row">
        <input id="search-input" type="text" placeholder="segment_id 입력 (예: 0102186)">
        <button id="search-btn">조회</button>
      </div>
      <div class="hint">지도에서 세그먼트를 클릭해도 됩니다. closure_penalty는 시간대별로 값이 달라집니다(centrality/base_capacity는 분기 1회 정적값이라 안 바뀝니다).</div>
    </div>

    <div class="side-section detail" id="detail">
      <div class="empty">세그먼트를 검색하거나 지도에서 클릭하세요.</div>
    </div>

    <div class="side-section legend" id="legend"></div>
  </div>

<script>
const RAMP = ["--r0","--r1","--r2","--r3","--r4"];
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

let SEGMENTS = [];      // [{segment_id, road_class, traffic_score, coords:[x1,y1,x2,y2,...]}, ...]
let idToIndex = {};
let buckets = [[],[],[],[],[]];
let missing = [];
let selectedSegmentId = null;

// closure_penalty가 segment_id x hour라 시간대별로 traffic_score가 달라진다
// (centrality/base_capacity는 분기 1회 정적값이라 시간과 무관). America/New_York
// 기준으로 계산 — 백엔드(get_traffic_score/get_map_data)가 ts_hour=None일 때
// 자동으로 대체하는 시간대와 동일 기준.
function nyHourNow() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", hour: "numeric", hour12: false,
  }).format(new Date());
  return parseInt(parts, 10) % 24;
}

let selectedHour = nyHourNow();

function hourQuery() {
  return `?ts_hour=${selectedHour}`;
}

async function loadMapData() {
  const res = await fetch(`/api/segments/map${hourQuery()}`);
  SEGMENTS = await res.json();
  SEGMENTS.forEach((s, i) => { idToIndex[s.segment_id] = i; });

  const scored = SEGMENTS.filter(s => s.traffic_score !== null).map(s => s.traffic_score).sort((a,b)=>a-b);
  const q = p => scored[Math.min(scored.length-1, Math.floor(p*scored.length))];
  const bounds = [q(0.2), q(0.4), q(0.6), q(0.8), Infinity];

  buckets = [[],[],[],[],[]];
  missing = [];
  SEGMENTS.forEach((s, i) => {
    if (s.traffic_score === null) { missing.push(i); return; }
    const b = bounds.findIndex(x => s.traffic_score <= x);
    buckets[b < 0 ? 4 : b].push(i);
  });

  document.getElementById("status").textContent = `${SEGMENTS.length.toLocaleString()}개 세그먼트`;
  renderLegend();
}

// ---------- 좌표 변환 ----------
let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
function computeBounds() {
  for (const s of SEGMENTS) {
    const c = s.coords;
    for (let i=0;i<c.length;i+=2) {
      if (c[i]<minX) minX=c[i]; if (c[i]>maxX) maxX=c[i];
      if (c[i+1]<minY) minY=c[i+1]; if (c[i+1]>maxY) maxY=c[i+1];
    }
  }
}

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const pickCanvas = document.createElement("canvas");
const pickCtx = pickCanvas.getContext("2d", { willReadFrequently: true });

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let view = { scale: 1, tx: 0, ty: 0 };
let baseScale=1, baseTx=0, baseTy=0;
let dataW=1, dataH=1;
let selectedIndex = -1;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  canvas.style.width = rect.width+"px"; canvas.style.height = rect.height+"px";
  pickCanvas.width = canvas.width; pickCanvas.height = canvas.height;
  fitToData(rect.width, rect.height);
  draw();
}
function fitToData(w,h) {
  dataW = maxX-minX; dataH = maxY-minY;
  const pad = 24;
  baseScale = Math.min((w-pad*2)/dataW, (h-pad*2)/dataH);
  baseTx = pad - minX*baseScale;
  baseTy = h-pad + minY*baseScale;
  view = { scale: 1, tx: 0, ty: 0 };
}
function toScreen(x,y) {
  return [(x*baseScale+baseTx)*view.scale+view.tx, (baseTy-y*baseScale)*view.scale+view.ty];
}

function draw() {
  const w=canvas.width, h=canvas.height;
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w/dpr,h/dpr);
  pickCtx.save(); pickCtx.setTransform(dpr,0,0,dpr,0,0); pickCtx.clearRect(0,0,w/dpr,h/dpr);

  ctx.lineCap = "round";

  ctx.beginPath(); ctx.strokeStyle = cssVar("--ink-muted"); ctx.lineWidth = 0.4;
  for (const i of missing) drawSeg(ctx, SEGMENTS[i]);
  ctx.stroke();

  for (let b=0;b<5;b++) {
    // 굵기 차이를 크게 두면 상위 구간(마지막에, 두껍게 그려짐)이 화면을 시각적으로
    // 압도해버려서(실측: 스크린샷 픽셀의 70%가 최상위 구간 색) 색상만으로 구분되게
    // 굵기 차이를 최소화한다.
    ctx.beginPath(); ctx.strokeStyle = cssVar(RAMP[b]); ctx.lineWidth = 0.7+b*0.1;
    for (const i of buckets[b]) drawSeg(ctx, SEGMENTS[i]);
    ctx.stroke();
  }

  // 피킹 캔버스: 세그먼트마다 고유 색(인덱스 인코딩), 두껍게 그려서 클릭 잘 잡히게
  for (let i=0;i<SEGMENTS.length;i++) {
    pickCtx.beginPath();
    pickCtx.strokeStyle = indexToColor(i);
    pickCtx.lineWidth = Math.max(4, 3*view.scale); // 화면 배율에 비례해서 클릭 영역 확보
    drawSeg(pickCtx, SEGMENTS[i]);
    pickCtx.stroke();
  }

  if (selectedIndex >= 0) {
    ctx.beginPath(); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
    drawSeg(ctx, SEGMENTS[selectedIndex]);
    ctx.stroke();
  }

  ctx.restore(); pickCtx.restore();
}
function drawSeg(context, seg) {
  const c = seg.coords;
  for (let i=0;i+3<c.length;i+=2) {
    const [sx1,sy1] = toScreen(c[i],c[i+1]);
    const [sx2,sy2] = toScreen(c[i+2],c[i+3]);
    context.moveTo(sx1,sy1); context.lineTo(sx2,sy2);
  }
}
function indexToColor(i) {
  const r = (i >> 16) & 255, g = (i >> 8) & 255, b = i & 255;
  return `rgb(${r},${g},${b})`;
}
function colorToIndex(r,g,b) { return (r<<16) | (g<<8) | b; }

function renderLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  const cap = document.createElement("div"); cap.className="cap"; cap.textContent = "traffic_score (5분위)";
  legend.appendChild(cap);
  const labels = ["0~20%tile","20~40%tile","40~60%tile","60~80%tile","80~100%tile"];
  RAMP.forEach((v,i) => {
    const row = document.createElement("div"); row.className="row";
    const sw = document.createElement("span"); sw.className="swatch"; sw.style.background = cssVar(v);
    const name = document.createElement("span"); name.textContent = `${labels[i]} (${buckets[i].length.toLocaleString()})`;
    row.append(sw, name); legend.appendChild(row);
  });
  const row = document.createElement("div"); row.className="row";
  const sw = document.createElement("span"); sw.className="swatch"; sw.style.background = cssVar("--ink-muted");
  const name = document.createElement("span"); name.textContent = `결측(용량 없음) (${missing.length.toLocaleString()})`;
  row.append(sw, name); legend.appendChild(row);
}

// ---------- 상세 패널 (config 컴포넌트 목록을 그대로 순회해서 렌더링) ----------
function renderDetail(data) {
  const el = document.getElementById("detail");
  if (!data) { el.innerHTML = '<div class="empty">세그먼트를 찾을 수 없습니다.</div>'; return; }

  const scoreText = data.traffic_score === null ? "—" : data.traffic_score.toFixed(6);
  let html = `
    <div class="seg-id">${data.segment_id}</div>
    <div class="score-label">traffic_score_v0</div>
    <div class="score">${scoreText}</div>
    <span class="ts-hour">ts_hour: ${data.ts_hour ?? "static"}</span>
  `;

  for (const [group, groupLabel] of [["demand","Demand"], ["capacity","Capacity"]]) {
    const g = data.components[group];
    html += `<div class="comp-group"><div class="cap">${groupLabel}</div>`;
    for (const item of g.items) {
      html += `<div class="comp-row"><span>${item.name} (×${item.weight})</span><span class="v">${item.value.toFixed(4)}</span></div>`;
    }
    html += `<div class="comp-total"><span>합계</span><span class="v">${g.value.toFixed(4)}</span></div></div>`;
  }

  el.innerHTML = html;
}

async function selectSegment(segmentId) {
  try {
    const res = await fetch(`/api/traffic_score/${segmentId}${hourQuery()}`);
    if (!res.ok) { renderDetail(null); return; }
    const data = await res.json();
    renderDetail(data);
    selectedSegmentId = segmentId;
    selectedIndex = idToIndex[segmentId] ?? -1;
    draw();
  } catch (e) {
    renderDetail(null);
  }
}

document.getElementById("search-btn").addEventListener("click", () => {
  const id = document.getElementById("search-input").value.trim();
  if (id) selectSegment(id);
});
document.getElementById("search-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("search-btn").click();
});

// ---------- 시간대 선택 ----------
const hourSlider = document.getElementById("hour-slider");
const hourLabel = document.getElementById("hour-label");

function setHourLabel() {
  hourLabel.textContent = String(selectedHour).padStart(2, "0");
}

async function applyHourChange() {
  setHourLabel();
  await loadMapData();
  // 지도 색상이 시간대별로 바뀐 걸 다시 그림. 선택돼 있던 세그먼트가 있으면
  // 그 시간대 기준으로 상세 패널도 다시 조회한다(같은 segment_id, 새 ts_hour).
  if (selectedSegmentId) {
    await selectSegment(selectedSegmentId);
  } else {
    draw();
  }
}

hourSlider.value = selectedHour;
setHourLabel();
hourSlider.addEventListener("input", () => {
  selectedHour = parseInt(hourSlider.value, 10);
  applyHourChange();
});

document.getElementById("now-btn").addEventListener("click", () => {
  selectedHour = nyHourNow();
  hourSlider.value = selectedHour;
  applyHourChange();
});

// ---------- 팬/줌/클릭 ----------
let dragging=false, moved=false, lastX=0, lastY=0;
canvas.addEventListener("pointerdown",(e)=>{dragging=true;moved=false;lastX=e.clientX;lastY=e.clientY;canvas.classList.add("grabbing");canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointermove",(e)=>{
  if(!dragging) return;
  if (Math.abs(e.clientX-lastX)>2 || Math.abs(e.clientY-lastY)>2) moved = true;
  view.tx += (e.clientX-lastX); view.ty += (e.clientY-lastY);
  lastX=e.clientX; lastY=e.clientY; draw();
});
canvas.addEventListener("pointerup",(e)=>{
  dragging=false; canvas.classList.remove("grabbing");
  if (!moved) handleClick(e);
});
canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const factor = Math.exp(-e.deltaY*0.0015);
  const newScale = Math.min(Math.max(view.scale*factor,0.5),60);
  const k = newScale/view.scale;
  view.tx = mx - k*(mx-view.tx); view.ty = my - k*(my-view.ty);
  view.scale = newScale;
  draw();
},{passive:false});
window.addEventListener("resize", resize);

function handleClick(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = Math.round((e.clientX-rect.left)*dpr), cy = Math.round((e.clientY-rect.top)*dpr);

  // 픽셀 1개만 읽으면 안티앨리어싱으로 가장자리가 반투명/혼색된 픽셀을 집을 확률이
  // 높아서(실측: alpha 48~152인 픽셀이 대부분) 클릭 지점 주변을 훑어 alpha가 가장
  // 높은(가장 "선명한") 픽셀을 고른다 — 얇은 선 클릭 판정을 관용적으로 만드는 목적도 겸함.
  const radius = 6;
  const x0 = Math.max(0, cx-radius), y0 = Math.max(0, cy-radius);
  const size = radius*2+1;
  const { data } = pickCtx.getImageData(x0, y0, size, size);
  let best = null, bestAlpha = 0;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i+3] > bestAlpha) { bestAlpha = data[i+3]; best = [data[i], data[i+1], data[i+2]]; }
  }
  if (!best || bestAlpha < 128) return; // 주변에 선명한 세그먼트 색이 없으면 빈 배경 클릭으로 간주
  const idx = colorToIndex(best[0], best[1], best[2]);
  const seg = SEGMENTS[idx];
  if (seg) selectSegment(seg.segment_id);
}

(async function init() {
  await loadMapData();
  computeBounds();
  resize();
})();
</script>
</body>
</html>
