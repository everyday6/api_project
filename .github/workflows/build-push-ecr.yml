# EC2(2 vCPU)에서 docker compose build로 이미지를 직접 빌드하면 pip install 등
# 빌드 자체가 CPU를 잡아먹어 배포 시점에 파이프라인 태스크와 자원 경합이 난다.
# 대신 여기서 미리 빌드해서 ECR에 push해두고, EC2는 docker compose pull만 하도록 한다.
# build-and-push가 끝나면 SSH로 EC2에 들어가 git pull + docker compose pull/up까지
# 이어서 한다.
#
# 필요한 사전 준비 (AWS 콘솔/GitHub, 리포지토리 관리자):
#   1. ECR 리포지토리 생성 (예: nav-api-airflow)
#   2. GitHub Actions가 push할 수 있는 IAM 롤 생성 (OIDC 신뢰 관계:
#      token.actions.githubusercontent.com, 이 리포지토리로 조건 제한)
#   3. 리포지토리 Settings > Secrets에 AWS_ECR_PUSH_ROLE_ARN 등록
#   4. EC2 인스턴스 롤에 ecr:GetAuthorizationToken / BatchGetImage /
#      GetDownloadUrlForLayer 권한 추가
#   5. EC2 보안그룹 22번 포트를 GitHub Actions에서 접근 가능하게 열기
#      (러너 IP가 고정이 아니라서 사실상 0.0.0.0/0으로 열어야 함 — SSH는
#      키 인증만 허용하고 비밀번호 로그인은 막혀 있어야 함)
#   6. 리포지토리 Settings > Secrets에 EC2_HOST / EC2_USER / EC2_SSH_KEY 등록
#   7. AWS_ECR_PUSH_ROLE_ARN 롤에 s3:PutObject 권한 추가
#      (리소스: arn:aws:s3:::${S3_BUCKET_DATA}/emr-jobs/python-env/*) —
#      build-emr-python-env 잡이 같은 롤로 S3에 직접 업로드한다
#
# EC2가 Graviton(arm64, t4g.large)이라 빌드도 arm64 러너에서 네이티브로 해야
# 한다 — amd64 러너(ubuntu-latest)에서 빌드하면 EC2가 에뮬레이션으로 억지로
# 돌리다 실패한다(exit 255).
#
# docker/emr-python-env/Dockerfile은 반대로 EMR Serverless(x86_64)용이라
# amd64로 고정돼 있다. 예전엔 이걸 deploy 단계에서 (arm64) EC2가 직접
# 빌드했는데, 그러면 이번엔 EC2 쪽이 amd64를 에뮬레이션하다 똑같이 exit
# 255로 죽는다. 그래서 이 이미지는 build-emr-python-env 잡에서 amd64
# 러너(ubuntu-latest)로 네이티브 빌드해서 S3에 직접 올리고, EC2 배포
# 스크립트에서는 더 이상 빌드하지 않는다.
name: Build and Push to ECR

on:
  push:
    branches: [nav]
    paths:
      - Dockerfile
      - requirements.txt
      - requirements-lambda.txt
      - src/**
      - dags/**
      - docker/emr-python-env/Dockerfile
      - docker/lambda/Dockerfile
      - .github/workflows/build-push-ecr.yml
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: nav-api-airflow
  S3_BUCKET_DATA: nav-api-data-lsy341

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  build-and-push-lambda:
    # nav-api 서빙 API는 ECS/ALB 대신 Lambda + API Gateway로 돈다(ALB가
    # 조직 SCP로 막혀 있었다 — docs/superpowers/plans/2026-08-22-nav-api-lambda-migration.md).
    # 같은 ECR 리포지토리에 lambda- 접두사 태그로 별도 이미지를 올린다.
    # amd64 Lambda 이미지라 amd64 러너에서 네이티브로 빌드한다 — arm64
    # 러너(build-and-push job과 달리 여긴 Graviton EC2 제약이 없다)에서
    # --platform linux/amd64로 크로스 빌드하면 GitHub 호스팅 러너엔 QEMU가
    # 기본 설치돼 있지 않아 실패한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (Lambda 이미지)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build --platform linux/amd64 -f docker/lambda/Dockerfile \
            -t "$IMAGE:lambda-${{ github.sha }}" -t "$IMAGE:lambda-latest" .
          docker push "$IMAGE:lambda-${{ github.sha }}"
          docker push "$IMAGE:lambda-latest"

  build-emr-python-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: docker/emr-python-env/Dockerfile 변경 여부 확인
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            emr:
              - docker/emr-python-env/Dockerfile

      - name: Configure AWS credentials
        if: steps.changes.outputs.emr == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and upload to S3
        if: steps.changes.outputs.emr == 'true'
        run: bash scripts/package_emr_dependencies.sh

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/three-idiots
            git pull
            # EMR Serverless용 파이썬 venv 패키지는 더 이상 여기서 만들지
            # 않는다 — docker/emr-python-env/Dockerfile이 amd64 고정이라
            # arm64 EC2에서 빌드하면 QEMU 에뮬레이션 위에서 dnf가 죽는다
            # (exit 255). build-emr-python-env 잡이 amd64 GitHub Actions
            # 러너에서 미리 빌드해 S3에 올려둔다.
            set -a; source .env; set +a
            docker run --rm --network host amazon/aws-cli ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin 181252290322.dkr.ecr.ap-northeast-2.amazonaws.com
            docker compose pull
            # --remove-orphans: 서비스 이름이 바뀌면(예: traffic-score-api ->
            # navigation-api) 옛 이름의 컨테이너가 새 compose 파일엔 없는
            # "orphan"으로 남아 포트를 계속 물고 있는다. 그대로면 새 컨테이너가
            # 같은 호스트 포트를 못 열고 뜬다.
            docker compose up -d --remove-orphans
