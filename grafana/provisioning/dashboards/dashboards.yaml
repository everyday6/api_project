# 이 폴더(json 파일들)를 Grafana가 시작할 때 자동으로 대시보드로
# 등록한다 - UI에서 수동으로 만들면 컨테이너/볼륨이 새로 생길 때마다
# 없어지므로, git으로 관리되는 JSON 파일로 둔다.
apiVersion: 1

providers:
  - name: nav-gold
    folder: "nav-gold"
    type: file
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
